<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540">
  <title>MRD 偵測在做什麼</title>
  <desc>上半部說明臨床處境：病人接受手術切除腫瘤之後，影像檢查上已看不到腫瘤，
        但體內仍可能殘存極少量癌細胞。等到影像重新看得見時，往往已經復發。
        目標是在影像看得見之前就偵測到殘存。
        下半部說明偵測流程，由兩條資料來源匯合。
        左邊一條：取腫瘤組織定序，並與正常組織比對，
        得到這位病人專屬的體細胞突變清單，規模為數千至數萬個位點。
        中間一條：抽一管血，血漿中含有游離 DNA，
        其中絕大多數來自正常細胞，只有極少部分來自腫瘤。
        兩條匯合到右邊：在血漿的定序資料中，
        逐一檢查突變清單上的每個位點是否出現對應的突變。
        找到的量若明顯高於背景雜訊，即判定體內仍有殘存腫瘤。
        圖最下方標出核心困難：腫瘤來源的 DNA 只佔血漿游離 DNA 的十萬分之一，
        與定序機本身的錯誤率同一個數量級，因此訊號與雜訊難以分辨。</desc>

  <text class="ttl bold zh" x="20" y="34">MRD 偵測在做什麼</text>

  <!-- ══ 上：臨床處境 ══ -->
  <rect class="box plain" x="20" y="56" width="960" height="104" rx="10"/>
  <text class="anno bold zh" x="44" y="86">臨床處境</text>

  <g>
    <rect class="box" x="128" y="98" width="180" height="46" rx="8"/>
    <text class="anno bold mid zh" x="218" y="127">手術切除腫瘤</text>

    <path class="conn" d="M316 121 L344 121" marker-end="url(#mrd-a)"/>

    <rect class="box" x="352" y="98" width="216" height="46" rx="8"/>
    <text class="anno bold mid zh" x="460" y="127">影像上看不到了</text>

    <path class="conn" d="M576 121 L604 121" marker-end="url(#mrd-a)"/>

    <rect class="box" x="612" y="98" width="248" height="46" rx="8"/>
    <text class="anno bold mid somatic zh" x="736" y="127">但可能還殘存極少量癌細胞</text>
  </g>
  <text class="tick zh" x="880" y="127">← 要測的就是它</text>

  <defs>
    <marker id="mrd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="conn" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- ══ 下：偵測流程 ══ -->
  <text class="anno bold zh" x="20" y="196">偵測流程：兩條資料來源匯合</text>

  <!-- 左：腫瘤組織 -->
  <rect class="box" x="20" y="212" width="290" height="196" rx="10"/>
  <text class="anno bold mid accent zh" x="165" y="240">① 腫瘤組織</text>

  <rect class="box plain" x="44" y="256" width="242" height="42" rx="7"/>
  <text class="tick mid zh" x="165" y="282">腫瘤 + 正常組織，各自定序</text>

  <path class="conn" d="M165 306 L165 322" marker-end="url(#mrd-a)"/>

  <rect class="box plain" x="44" y="330" width="242" height="62" rx="7"/>
  <text class="anno bold mid zh" x="165" y="356">病人專屬突變清單</text>
  <text class="tick mid zh" x="165" y="380">數千至數萬個位點</text>

  <!-- 中：血液 -->
  <rect class="box" x="330" y="212" width="290" height="196" rx="10"/>
  <text class="anno bold mid accent zh" x="475" y="240">② 抽一管血</text>

  <rect class="box plain" x="354" y="256" width="242" height="42" rx="7"/>
  <text class="tick mid zh" x="475" y="282">血漿中的游離 DNA</text>

  <path class="conn" d="M475 306 L475 322" marker-end="url(#mrd-a)"/>

  <rect class="box plain" x="354" y="330" width="242" height="62" rx="7"/>
  <text class="tick mid zh" x="475" y="354">絕大多數來自正常細胞</text>
  <text class="anno bold mid somatic zh" x="475" y="380">極少部分來自腫瘤</text>

  <!-- 匯合箭頭 -->
  <path class="conn thick" d="M310 310 L328 310"/>
  <path class="conn thick" d="M620 310 L648 310" marker-end="url(#mrd-a)"/>

  <!-- 右：比對與判定 -->
  <rect class="box" x="656" y="212" width="324" height="196" rx="10"/>
  <text class="anno bold mid accent zh" x="818" y="240">③ 在血液資料中搜尋</text>

  <rect class="box plain" x="680" y="256" width="276" height="42" rx="7"/>
  <text class="tick mid zh" x="818" y="282">逐一檢查清單上的每個位點</text>

  <path class="conn" d="M818 306 L818 322" marker-end="url(#mrd-a)"/>

  <rect class="box plain" x="680" y="330" width="276" height="62" rx="7"/>
  <text class="anno bold mid zh" x="818" y="356">找到的量高於背景雜訊</text>
  <text class="anno bold mid ok zh" x="818" y="380">→ 判定仍有殘存</text>

  <!-- ══ 核心困難 ══ -->
  <rect class="box" x="20" y="428" width="960" height="94" rx="10"/>
  <text class="anno bold zh" x="44" y="458">核心困難</text>
  <text class="tick zh" x="44" y="486">腫瘤來源的 DNA 只佔血漿游離 DNA 的<tspan class="somatic bold">十萬分之一</tspan>，</text>
  <text class="tick zh" x="44" y="508">與定序機本身的錯誤率<tspan class="bold">同一個數量級</tspan> —— 訊號與雜訊分不開。</text>
  <text class="anno bold accent zh" x="600" y="497">十餘年來各家方法都在解這一件事</text>
</svg>
