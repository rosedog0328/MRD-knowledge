<!doctype html>
<html lang="zh-Hant-TW" data-gloss="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{slot:title}}</title>
<meta name="description" content="{{slot:desc}}">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/diagram.css">
<link rel="stylesheet" href="assets/css/diagram-ext.css">
<link rel="stylesheet" href="assets/css/matrix.css">
<link rel="stylesheet" href="assets/css/print.css">
<script>
/* 主題 / 字級 / 詞彙語言：必須在第一次繪製前套用，否則會閃一下白底。
   刻意寫成同步的 inline script，不可移到外部檔案。 */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('ccu.mrd.knowledge.v1') || '{}');
    var ui = s.ui || {};
    var d = document.documentElement;
    if (ui.theme === 'dark' || ui.theme === 'light') d.setAttribute('data-theme', ui.theme);
    if (ui.fontScale && ui.fontScale !== 'm') d.setAttribute('data-fs', ui.fontScale);
    if (ui.glossLang) d.setAttribute('data-gloss', ui.glossLang);
  } catch (e) { /* Safari 私密瀏覽會丟 QuotaExceededError，忽略即可 */ }
})();
</script>
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <div class="site-header__in">
    <a class="brand" href="index.html">
      MRD 偵測方法知識庫
      <small>中正大學資工系 · 黃耀廷實驗室</small>
    </a>
    <span class="site-header__spacer"></span>

    <span class="hgroup gloss-toggle" role="group" aria-label="術語定義語言">
      <button type="button" class="hbtn" data-gloss-btn="zh"   aria-pressed="true">繁中</button>
      <button type="button" class="hbtn" data-gloss-btn="en"   aria-pressed="false">English</button>
      <button type="button" class="hbtn" data-gloss-btn="both" aria-pressed="false">雙語</button>
    </span>

    <button type="button" class="hbtn theme-toggle" data-theme-btn
            aria-label="切換深色／淺色主題">◐</button>
    <button type="button" class="hbtn" data-fs-btn aria-label="調整字級">A</button>
    <a class="hbtn" href="glossary.html">完整術語表</a>
  </div>
</header>

<div class="wrap {{slot:wrapclass}}">
  <main class="main" id="main">
    {{slot:body}}
    {{slot:pager}}
    {{slot:glossary-appendix}}
  </main>
  {{slot:toc}}
</div>

<footer class="site-footer">
  本教材供中正大學資工系黃耀廷實驗室新進成員自學，聚焦
  <code>LongPhase-S</code> 與 <code>LongPhase-TO</code> 的概念、證據與限制。
</footer>

{{slot:defs}}
<script src="assets/js/progress.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/glossary.js"></script>
<script src="assets/js/quiz.js"></script>
{{slot:scripts}}
</body>
</html>
